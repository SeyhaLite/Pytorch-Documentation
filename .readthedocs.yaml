# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  # PyTorch is NOT installed on Read the Docs: it is only needed to *run* the
  # code examples locally, never to render them. Keeping it out of the build
  # saves ~2 GB of downloads and several minutes of build time.
  jobs:
    pre_build:
      # Fail the build early on the two classes of bug that are cheap to catch
      # here and expensive to notice later:
      #   * an example file no page references (or a stale literalinclude path)
      #   * a truncated Markdown fence, which turns the rest of a page into one
      #     literal block and fails -W with a Pygments lexing warning
      - python tests/check_examples_referenced.py
      - python tools/check_markdown.py
    post_build:
      # Needs the built searchtools.js, so it can only run after the build.
      # Verifies the committed Khmer JS catalog still covers every msgid the
      # installed Sphinx version actually looks up, and that no theme/Sphinx UI
      # string fell back to English.
      - python tests/check_locale.py
      - python tests/check_ui_strings.py

sphinx:
  configuration: docs/source/conf.py
  builder: html
  fail_on_warning: true

python:
  install:
    - requirements: docs/requirements.txt

formats: []

search:
  ranking:
    index.md: 10
    getting-started.md: 9
    installation.md: 8
